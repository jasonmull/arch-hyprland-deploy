# Example: desktop with two side-by-side displays.
#
# Copy this directory to hosts/<your-hostname>/ and edit. Connector names and
# supported modes come from:  hyprctl monitors

monitor = DP-1, 3440x1440@144, 0x0, 1
monitor = DP-2, 2560x1440@60, 3440x0, 1
monitor = , preferred, auto, auto

# Pin workspaces to a specific display so they always open where you expect.
workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 9, monitor:DP-2, default:true
workspace = 10, monitor:DP-2
