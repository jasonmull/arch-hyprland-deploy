# Example: laptop with an external display.
#
# Copy this directory to hosts/<your-hostname>/ and edit. Get the connector
# names and modes from:  hyprctl monitors
#
# Internal panel, 2560x1600@120, at origin, 1.6x fractional scale.
monitor = eDP-1, 2560x1600@120, 0x0, 1.6

# External display to the right of the internal one, native scale.
# 1600 = 2560 / 1.6, i.e. the logical width of the internal panel.
monitor = DP-1, 3840x2160@60, 1600x0, 1.5

# Anything else that gets plugged in: best effort.
monitor = , preferred, auto, auto

# Close the lid -> disable the internal panel, but only while docked.
bindl = , switch:on:Lid Switch,  exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, 2560x1600@120, 0x0, 1.6"
