# Idle management - stowed to ~/.config/hypr/hypridle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock          # avoid stacking lockers
    before_sleep_cmd = loginctl lock-session       # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on     # wake the display reliably
}

# Dim the backlight as a warning shot.
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# Lock the screen.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Turn the display off.
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# Suspend. Commented out by default - enable per machine in local.conf if you
# want it, since it is usually wrong for a desktop.
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
# }
