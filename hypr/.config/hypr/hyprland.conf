# =============================================================================
#  Hyprland configuration
#  Managed by arch-hyprland-deploy - stowed to ~/.config/hypr/hyprland.conf
#
#  Do NOT put machine-specific settings in this file. They belong in:
#    ~/.config/hypr/monitors.conf  -> per-host, symlinked from hosts/<name>/
#    ~/.config/hypr/local.conf     -> this machine only, never committed
#
#  Syntax targets Hyprland 0.49+ (unified `windowrule`). Check
#  `hyprctl version` if rules are rejected after an upgrade.
# =============================================================================

# --- Variables ---------------------------------------------------------------
$mainMod  = SUPER
$terminal = ghostty
$launcher = rofi -show drun
$filemgr  = thunar
$scripts  = ~/.local/bin

# --- Per-host and local includes ---------------------------------------------
# install.sh guarantees both files exist, so these sources never error.
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/local.conf

# --- Environment -------------------------------------------------------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# --- Autostart ---------------------------------------------------------------
exec-once = hyprpanel
exec-once = mako
exec-once = [ -f ~/Pictures/wallpapers/wall.png ] && hyprpaper
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --watch cliphist store

# --- Input -------------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

# --- Look and feel -----------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(45475aaa)
    resize_on_border = true
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000055)
    }
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    bezier = snappy, 0.2, 1.0, 0.3, 1.0

    animation = windows,     1, 4, snappy, popin 85%
    animation = windowsOut,  1, 4, smooth, popin 85%
    animation = border,      1, 8, default
    animation = fade,        1, 4, smooth
    animation = workspaces,  1, 4, snappy, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
}

# --- Window rules ------------------------------------------------------------
# Float the small utility dialogs that have no business being tiled.
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(org.pulseaudio.pavucontrol)$
windowrule = float, class:^(xdg-desktop-portal-gtk)$
windowrule = float, title:^(Open File)$
windowrule = float, title:^(Save File)$
windowrule = float, title:^(Choose Files)$
windowrule = size 800 600, class:^(pavucontrol)$
windowrule = center, class:^(pavucontrol)$

# Picture-in-picture floats and pins above everything.
windowrule = float, title:^(Picture-in-Picture)$
windowrule = pin, title:^(Picture-in-Picture)$
windowrule = size 640 360, title:^(Picture-in-Picture)$

# Never blank the screen during fullscreen video or games.
windowrule = idleinhibit fullscreen, class:.*

# Keep the terminal readable - no transparency on the focused window.
windowrule = opacity 1.0 0.94, class:^(com.mitchellh.ghostty)$

# Layer rules for the panel and launcher.
layerrule = blur, rofi
layerrule = ignorezero, rofi
layerrule = blur, notifications
layerrule = ignorezero, notifications

# --- Keybinds: applications --------------------------------------------------
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, SPACE,  exec, $launcher
bind = $mainMod, E,      exec, $filemgr
bind = $mainMod, TAB,    exec, $scripts/hypr-window-switch
bind = $mainMod, PERIOD, exec, bemoji -t
bind = $mainMod SHIFT, V, exec, cliphist list | rofi -dmenu -i -p "Clipboard" | cliphist decode | wl-copy
bind = $mainMod, L,      exec, hyprlock

# --- Keybinds: window management ---------------------------------------------
bind = $mainMod, Q,           killactive,
bind = $mainMod, F,           fullscreen, 0
bind = $mainMod, V,           togglefloating,
bind = $mainMod, P,           pseudo,
bind = $mainMod, J,           togglesplit,
bind = $mainMod SHIFT, Q,     exit,

# Focus (arrows and vim keys).
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = $mainMod, H,     movefocus, l
bind = $mainMod, K,     movefocus, u

# Move windows.
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Resize.
binde = $mainMod CTRL, left,  resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up,    resizeactive, 0 -40
binde = $mainMod CTRL, down,  resizeactive, 0 40

# Mouse: drag to move, right-drag to resize.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Keybinds: workspaces ----------------------------------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, scratch
bind = $mainMod SHIFT, S, movetoworkspace, special:scratch

bind = $mainMod CTRL, right, workspace, e+1
bind = $mainMod CTRL, left,  workspace, e-1
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# --- Keybinds: screenshots ---------------------------------------------------
# PRINT           -> select a region, annotate in swappy
# SHIFT+PRINT     -> region straight to the clipboard, no annotation
# CTRL+PRINT      -> whole focused output to ~/Pictures/Screenshots
bind = , PRINT,       exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, PRINT,  exec, grim -g "$(slurp)" - | wl-copy
bind = CTRL, PRINT,   exec, grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# --- Keybinds: media and hardware keys ---------------------------------------
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
