# Wallpaper - stowed to ~/.config/hypr/hyprpaper.conf
#
# Drop an image at ~/Pictures/wallpapers/wall.png and it is picked up on the
# next login. hyprpaper is only autostarted when that file exists (see the
# guarded exec-once in hyprland.conf), so a missing wallpaper is not an error.
#
# The wallpaper itself is intentionally NOT tracked in this repo - binaries
# bloat the history and yours is machine taste, not deployment config.

preload = ~/Pictures/wallpapers/wall.png
wallpaper = , ~/Pictures/wallpapers/wall.png
splash = false
ipc = on
